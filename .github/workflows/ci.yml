name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            runner: windows-2025
            arch: x64
            test: true
          - name: arm64
            runner: windows-11-arm
            arch: arm64
            test: true
          # Mirrors building on an x64 developer machine. x64 hardware can't run ARM64 binaries,
          # so this job builds only; ARM64 tests run in the native arm64 job above.
          - name: arm64 (cross-compiled on x64, build only)
            runner: windows-2025
            arch: arm64
            test: false
    env:
      # Fallback if the Visual Studio developer environment doesn't provide vcpkg.
      VCPKG_ROOT: C:\vcpkg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache vcpkg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ matrix.runner }}-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-${{ matrix.runner }}-${{ matrix.arch }}-

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\.nuget\packages
          key: nuget-${{ matrix.runner }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ matrix.runner }}-

      - name: Prepare the desktop for foreground tests
        if: matrix.test
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\prepare-ci-desktop.ps1

      - name: Build and test (Debug)
        if: matrix.test
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\build.ps1 -Arch ${{ matrix.arch }} -Config Debug

      - name: Build and test (Release)
        if: matrix.test
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\build.ps1 -Arch ${{ matrix.arch }} -Config Release

      - name: Build only (Release)
        if: ${{ !matrix.test }}
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\build.ps1 -Arch ${{ matrix.arch }} -Config Release -NoTest

  format:
    name: Formatting
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Pinned: clang-format output changes between LLVM versions. Keep in step with README.md.
      - name: clang-format
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $files = git ls-files '*.cpp' '*.h'
          pipx run --spec clang-format==23.1.3 clang-format --dry-run --Werror @files

      # The analyzers pass of plain `dotnet format` can't see XAML-generated code; analyzers already run
      # as errors during the build.
      - name: dotnet format
        shell: pwsh
        run: |
          # Without this, a multi-line step only fails if its last command fails.
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet format whitespace Harbor.slnx --verify-no-changes
          dotnet format style Harbor.slnx --verify-no-changes
